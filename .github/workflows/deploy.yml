name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 部署官方服务器配置端点

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 部署成功通知
        if: success()
        run: |
          echo "✅ Workers 部署成功！"
          echo "配置端点: https://petnote-config.c237b2d42470636339faa8103380f0ed.workers.dev/server"
          echo "预计 1-5 分钟内全球 CDN 生效"

      - name: 部署失败通知
        if: failure()
        run: |
          echo "❌ Workers 部署失败，请检查日志"
          echo "常见问题："
          echo "1. CLOUDFLARE_API_TOKEN 是否正确设置"
          echo "2. API Token 权限是否包含 Workers Scripts:Edit"
          echo "3. Account ID 是否正确"
