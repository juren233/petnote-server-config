name = "petnote-config"
main = "worker.js"
compatibility_date = "2024-01-01"
account_id = "c237b2d42470636339faa8103380f0ed"

# Workers 部署到 Cloudflare 全球边缘网络
# 国内访问延迟通常 < 50ms

[vars]
OFFICIAL_SERVER_URL = "wss://petnote.juren233.top/ws"

# 更新服务器地址流程：
# 1. 修改上面的 OFFICIAL_SERVER_URL 值
# 2. git add wrangler.toml
# 3. git commit -m "更新官方服务器地址"
# 4. git push
# 5. GitHub Actions 自动部署（查看 Actions 标签页）
# 6. 等待 1-5 分钟 CDN 缓存刷新
